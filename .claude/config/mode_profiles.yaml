# Mode Profiles Configuration
# Canonical definitions of execution modes and their constraints
# Last updated: 2026-03-16

modes:
  default:
    name: "Pure Ollama Agent Mode"
    description: >
      Ollama agents only. No Claude execution. No mixed execution.
      Freezes immediately if Ollama is required but unavailable.
    allow_claude: false
    allow_ollama: true
    allow_mixed: false
    allow_fallback_to_claude: false
    require_ollama_available: true
    max_token_budget: null
    cost_threshold: null
    llm_allowlist: []

  adaptive:
    name: "Adaptive Claude + Ollama Agent Mode"
    description: >
      Both Claude and Ollama agents allowed. Mixed execution allowed.
      Claude used as fallback when Ollama unavailable or for complex reasoning.
    allow_claude: true
    allow_ollama: true
    allow_mixed: true
    allow_fallback_to_claude: true
    require_ollama_available: false
    max_token_budget: null
    cost_threshold: null
    llm_allowlist: ["claude-haiku-4-5", "claude-sonnet-4-6", "claude-opus-4-6"]

  claude-min:
    name: "Claude with Cheap/Minimal Agents Only"
    description: >
      Claude only. Restricted to cheap/minimal models and operations.
      Haiku model preferred. No expensive models (Sonnet, Opus).
      No Ollama integration.
    allow_claude: true
    allow_ollama: false
    allow_mixed: false
    allow_fallback_to_claude: false
    require_ollama_available: false
    max_token_budget: 100000
    cost_threshold: null
    llm_allowlist: ["claude-haiku-4-5"]

# Default mode on system startup
default_mode: "default"

# Mode transition rules
transition_rules:
  from_default_to:
    - "adaptive"
    - "claude-min"
  from_adaptive_to:
    - "default"
    - "claude-min"
  from_claude_min_to:
    - "default"
    - "adaptive"

# Forbidden combinations (hard-coded enforcement)
forbidden_combinations:
  default:
    - "claude_execution"
    - "mixed_execution"
    - "claude_fallback"
  claude-min:
    - "ollama_execution"
    - "mixed_execution"
    - "expensive_models"  # Sonnet, Opus, etc.
