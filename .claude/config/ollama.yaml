version: 1

# Static policy / baseline config
# Runtime-selected global default is stored separately in:
# .claude/state/ollama_model_state.json

state_file: ".claude/state/ollama_model_state.json"

strict_model_validation: true
strict_prompt_budget_enforcement: true
unknown_profile_fallback_to_default: true

# Safe global fallback for your CPU-heavy setup.
# Do not use a 32B coding model as the global default.
default_model: "qwen2.5-14b:research"

# Practical global ceilings for your machine.
global_num_ctx_tokens: 8192
global_prompt_budget_chars: 12000

runtime:
  max_loaded_runners: 1
  prefer_warm_reuse: true
  avoid_parallel_heavy_models: true
  auto_pull_missing_models: false
  validate_via_tags_before_show: true
  require_alias_resolution: true

resolution:
  model_order:
    - per_invocation_override
    - profile_model
    - state_default_model
    - config_default_model
  prompt_budget_order:
    - per_invocation_override
    - profile_prompt_budget_chars
    - global_prompt_budget_chars
  num_ctx_order:
    - per_invocation_override
    - profile_num_ctx_tokens
    - global_num_ctx_tokens

profiles:
  default:
    model: "qwen2.5-14b:research"
    fallback_models:
      - "qwen2.5-14b:summarize"
    prompt_budget_chars: 10000
    num_ctx_tokens: 8192
    params:
      temperature: 0.12
      top_p: 0.90
      top_k: 30
      repeat_penalty: 1.02
      min_p: 0.05
      num_thread: 16

  execution:
    # Keep this conservative.
    # Intentionally no dedicated heavy default here.
    fallback_models:
      - "qwen2.5-14b:research"
    prompt_budget_chars: 8000
    num_ctx_tokens: 4096
    params:
      temperature: 0.05
      top_p: 0.85
      top_k: 10
      repeat_penalty: 1.00
      min_p: 0.10
      num_thread: 16

  coding:
    model: "qwen2.5-coder-32b:coding"
    fallback_models:
      - "deepseek-coder-33b:coding"
      - "qwen2.5-14b:research"
    prompt_budget_chars: 10000
