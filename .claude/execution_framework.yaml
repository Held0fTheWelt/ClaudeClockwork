execution_framework:
  agents:
    orchestrator:
      id: "agent-001"
      name: "Orchestrator Agent"
      role: "orchestrator"
      max_concurrent_tasks: 5
    specialist:
      id: "agent-002"
      name: "Specialist Agent"
      role: "specialist"
      max_concurrent_tasks: 3
    critic:
      id: "agent-003"
      name: "Critic Agent"
      role: "critic"
      max_concurrent_tasks: 4
    worker:
      id: "agent-004"
      name: "Worker Agent"
      role: "worker"
      max_concurrent_tasks: 6
  task_templates:
    implementation:
      id: "tpl-001"
      name: "Implementation"
      steps: [setup, develop, test]
    review:
      id: "tpl-002"
      name: "Review"
      steps: [analyze, feedback]
    documentation:
      id: "tpl-003"
      name: "Documentation"
      steps: [draft, review]
    testing:
      id: "tpl-004"
      name: "Testing"
      steps: [unit, integration, system]
  workflow_definitions:
    standard_implementation:
      id: "wf-001"
      name: "Standard Implementation"
      steps: [implementation, review]
    rapid_review:
      id: "wf-002"
      name: "Rapid Review"
      steps: [review]
    full_validation:
      id: "wf-003"
      name: "Full Validation"
      steps: [implementation, testing]
  quality_gates:
    code_review:
      id: "gate-001"
      name: "Code Review"
      threshold: 90
      required: true
      enabled: true
    test_coverage:
      id: "gate-002"
      name: "Test Coverage"
      threshold: 80
      required: true
      enabled: true
    documentation:
      id: "gate-003"
      name: "Documentation"
      threshold: 70
      required: false
      enabled: true
    security_scan:
      id: "gate-004"
      name: "Security Scan"
      threshold: 95
      required: true
      enabled: true
    performance:
      id: "gate-005"
      name: "Performance"
      threshold: 85
      required: false
      enabled: true
  performance_budgets:
    implementation:
      token_budget: 8000
      time_budget_seconds: 3600
      max_parallel_tasks: 2
      max_memory_mb: 1024
    review:
      token_budget: 4000
      time_budget_seconds: 1800
      max_parallel_tasks: 1
      max_memory_mb: 512
    documentation:
      token_budget: 3000
      time_budget_seconds: 1200
      max_parallel_tasks: 1
      max_memory_mb: 256
  logging_configuration:
    log_level: "info"
    log_destinations: [file, console]
    log_retention_days: 30
    log_retention_max_size_mb: 500
    capture: [timestamps, agent_id, task_id, resource_usage, errors]
